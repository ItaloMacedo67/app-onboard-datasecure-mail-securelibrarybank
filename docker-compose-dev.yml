services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: app-onboard-dev:latest
    environment:
      - DISPLAY=${DISPLAY}
      - WEBKIT_DISABLE_COMPOSITING_MODE=1
      - XAUTHORITY=/tmp/.docker.xauth
    volumes:
      - .:/workspace:cached
      - cargo-cache:/home/vscode/.cargo
      - rustup-cache:/home/vscode/.rustup
      - target-cache:/workspace/target
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.ssh:/home/vscode/.ssh:ro
      - ~/.Xauthority:/tmp/.docker.xauth:ro
    devices:
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    stdin_open: true
    tty: true
    command: sleep infinity

volumes:
  rustup-cache: